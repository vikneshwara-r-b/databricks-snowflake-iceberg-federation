# Creates schema,volume for F1 analytics project

resources:
  schemas:
    bronze_schema:
      name: ${var.raw_zone_schema_name}
      catalog_name: ${var.catalog}
      comment: 'Raw/Bronze Layer for F1 analytics project'
    silver_schema:
      name: ${var.curated_zone_schema_name}
      catalog_name: ${var.catalog}
      comment: 'Silver Layer for F1 analytics project'
    gold_schema:
      name: ${var.analytics_zone_schema_name}
      catalog_name: ${var.catalog}
      comment: 'Gold Layer for F1 analytics project'

  volumes:
    raw_volume:
      catalog_name: ${var.catalog}
      name: ${var.raw_volume_name}
      schema_name: ${resources.schemas.bronze_schema.name}